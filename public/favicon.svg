<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dégradé bleu reprenant les couleurs de tes particules -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E67FF" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>
  </defs>
  
  <!-- Fond sombre arrondi -->
  <rect width="512" height="512" rx="120" fill="#0A0A0A" />
  
  <!-- Forme géométrique centrale (triangle tech) -->
  <path d="M256 120 L400 360 L112 360 Z" fill="none" stroke="url(#blueGrad)" stroke-width="40" stroke-linejoin="round" />
  
  <!-- Points de connexion (Nœuds) -->
  <circle cx="256" cy="120" r="35" fill="#FFFFFF" />
  <circle cx="400" cy="360" r="35" fill="#FFFFFF" />
  <circle cx="112" cy="360" r="35" fill="#FFFFFF" />
</svg>
